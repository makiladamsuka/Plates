name: CI / CD Pipeline

on:
  push:
    branches:
      - main
      - design2
  pull_request:
    branches:
      - main
      - design2
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── FRONTEND CI ──────────────────────────────────────────────
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm --prefix frontend install

      - name: Run Linter (Oxlint)
        run: npm --prefix frontend run lint

      - name: Typecheck & Build Frontend
        env:
          VITE_SUPABASE_URL: https://rvxyaepqrvtmprfjhtld.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_9h1vRM946kBiK5gBKZTUBQ_8DeObQYA
          VITE_API_URL: https://plates.live/api
        run: npm --prefix frontend run build

  # ─── BACKEND CI ───────────────────────────────────────────────
  backend-ci:
    name: Backend Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        run: npm --prefix backend install

      - name: Typecheck Backend (TypeScript)
        run: npm --prefix backend run typecheck

  # ─── MONOREPO VERIFICATION ────────────────────────────────────
  monorepo-build:
    name: Monorepo Production Build
    needs: [frontend-ci, backend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Run Full Production Build
        env:
          VITE_SUPABASE_URL: https://rvxyaepqrvtmprfjhtld.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_9h1vRM946kBiK5gBKZTUBQ_8DeObQYA
          VITE_API_URL: https://plates.live/api
        run: npm run build
